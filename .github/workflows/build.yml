name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libelf-dev libssl-dev uuid-dev pkg-config \
            autoconf automake libtool \
            python3 file

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      # envd's go.mod may pin a newer toolchain; GOTOOLCHAIN=auto fetches it.

      - uses: dtolnay/rust-toolchain@stable

      - name: Build all artifacts
        run: make dist TARGET_ARCH=${{ matrix.arch }}

      - name: Sanity checks
        run: |
          set -euxo pipefail
          cd dist/${{ matrix.arch }}
          sha256sum --check SHA256SUMS
          test -x vmlinux
          test -x cloud-hypervisor
          test -f rootfs.erofs
          test -f base.erofs
          # images must stay 2 MiB aligned / 512-byte aligned respectively
          test $(( $(stat -c %s rootfs.erofs) % 2097152 )) -eq 0
          test $(( $(stat -c %s base.erofs) % 512 )) -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: tt-artifacts-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error
