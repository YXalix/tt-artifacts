name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tt-artifacts-*
          merge-multiple: false

      - name: Package release assets
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-out
          # Full per-arch archive plus every artifact as an individual asset
          # ("<name>-<arch>"), each covered by SHA256SUMS-<arch>.txt so a
          # single-file download can be verified on its own. The per-arch
          # SHA256SUMS stays inside the archive.
          for d in tt-artifacts-*/; do
            arch="${d#tt-artifacts-}"; arch="${arch%/}"
            tar -czf "release-out/tt-artifacts-${arch}-${tag}.tar.gz" "${d%/}"
            (
              cd "${d%/}" && sha256sum --check SHA256SUMS >/dev/null
            )
            sums="release-out/SHA256SUMS-${arch}.txt"
            : > "$sums"
            for f in "${d%/}"/*; do
              name="$(basename "$f")"
              if [ "$name" = "SHA256SUMS" ]; then continue; fi
              asset="${name}-${arch}"
              cp "$f" "release-out/${asset}"
              printf '%s  %s\n' \
                "$(sha256sum "release-out/${asset}" | cut -d' ' -f1)" \
                "${asset}" >> "$sums"
            done
          done
          sha256sum release-out/*.tar.gz > release-out/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "tt-artifacts ${GITHUB_REF_NAME}" \
            --generate-notes \
            release-out/*
